<!DOCTYPE html>
<html>
<head>
<title>Library Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#0f0f0f,#1c1c1c,#2b2b2b);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-box{
    width:400px;
    background:#1e1e1e;
    padding:40px;
    border-radius:20px;
    box-shadow:0 20px 60px rgba(0,0,0,0.4);
}

h2{
    text-align:center;
    margin-bottom:25px;
    color:white;
}

input{
    width:100%;
    padding:15px;
    margin-bottom:15px;
    border:1px solid #333;
    border-radius:10px;
    background:#2a2a2a;
    color:white;
    font-size:15px;
}

input::placeholder{
    color:#aaa;
}

button{
    width:100%;
    padding:15px;
    border:none;
    background:white;
    color:#111;
    border-radius:10px;
    cursor:pointer;
    font-size:15px;
    font-weight:600;
    transition:.3s;
}

button:hover{
    background:#e5e5e5;
}

#error{
    color:#ff4d4d;
    text-align:center;
    margin-top:15px;
    font-weight:600;
}
</style>
</head>

<body>

<div class="login-box">

    <h2>Library Login</h2>

    <input type="text"
           id="username"
           placeholder="Username"
           onkeypress="enterLogin(event)">

    <input type="password"
           id="password"
           placeholder="Password"
           onkeypress="enterLogin(event)">

    <button onclick="login()">Login</button>

    <p id="error"></p>

</div>

<script>

function login(){

    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;

    if(username === "admin" && password === "1234"){

        localStorage.setItem("loggedIn","true");

        window.location.href = "main.html";

    }else{

        document.getElementById("error").innerHTML =
        "Invalid Username or Password!";
    }
}

function enterLogin(event){

    if(event.key === "Enter"){
        login();
    }
}

document.addEventListener("keydown", function(event){

    if(event.key === "Enter"){
        login();
    }
});

</script>

</body>
</html>
